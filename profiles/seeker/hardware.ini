# Seeker hardware profile for the Android emulator (applied to the AVD's config.ini).
# Sources: store.solanamobile.com (6.36" AMOLED 120 Hz, 8 GB RAM, 128 GB, Dimensity 7300)
# and reviews (1200x2670, 460 PPI). See docs/06-virtual-seeker.md.

hw.device.name=seeker
hw.device.manufacturer=Solana Mobile Inc.
avd.ini.displayname=Seeker (virtual)

# Screen: 1200 x 2670, 460 PPI. Android density bucket 480 = xxhdpi (TO VERIFY on a real Seeker: `adb shell wm density`)
hw.lcd.width=1200
hw.lcd.height=2670
hw.lcd.density=480
hw.initialOrientation=portrait
showDeviceFrame=no

# Memory: a real Seeker has 8 GB. We use 4 GB so a 16 GB Mac stays usable (configurable).
hw.ramSize=4096
vm.heapSize=512

# Storage: real is 128 GB; 16 GB data partition is enough for testing (file is sparse).
disk.dataPartition.size=16G

# CPU: Dimensity 7300 is 8 cores; give the emulator 4.
hw.cpu.ncore=4

# Input / sensors (Seeker has a power-button fingerprint sensor)
hw.keyboard=yes
hw.mainKeys=no
hw.gpu.enabled=yes
hw.gpu.mode=host
hw.sensors.orientation=yes
hw.sensors.proximity=yes
hw.camera.back=emulated
hw.camera.front=emulated
fastboot.forceColdBoot=no
